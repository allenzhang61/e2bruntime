<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>备份镜像文件</title>
<style>body{font:14px system-ui;background:#101319;color:#e5e9ef;margin:28px}h1{font-size:23px}a,summary{color:#9bc7ff}button{background:#243146;color:white;border:1px solid #53627a;border-radius:5px;padding:8px;cursor:pointer}nav{display:flex;gap:18px;align-items:center;margin:18px 0}.muted{color:#a8b5c9}.error{color:#ffaaaa}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{padding:12px;text-align:left;border-bottom:1px solid #354052;vertical-align:top}td p{margin:0 0 6px;line-height:1.4}code{overflow-wrap:anywhere}td small{display:block;color:#a8b5c9;margin-top:6px}summary{cursor:pointer}details p{margin-top:12px}th:nth-child(1){width:150px}th:nth-child(2){width:200px}</style>
<main id="view" data-logic-id="{{.LogicID}}"><h1>备份镜像文件：<code>{{.LogicID}}</code></h1><nav><a href="/">← 统一视图</a><a href="/logics/{{.LogicID}}/instances">查看实例</a><button id="refresh">刷新</button>{{template "refresh-controls" .}}</nav><p class="muted">按备份时间从新到旧排列。归档与 Metadata 分开保存；共享依赖层展示该备份实际引用的文件。</p><p id="checked"></p><p id="count"></p><p id="error" class="error" role="alert"></p><p id="empty" class="muted"></p>
<div class="table-wrap"><table><thead><tr><th>备份时间</th><th>来源 Runtime / 实例</th><th>镜像归档</th><th>Metadata</th><th>共享依赖层</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
const $=id=>document.getElementById(id);const logicID=$('view').dataset.logicId;let loading=false;const expandedArchives=new Set();
function text(parent,tag,value){const el=document.createElement(tag);el.textContent=value;parent.append(el);return el}
function file(parent,key,bytes){text(parent,'code',key);text(parent,'small',bytes.toLocaleString()+' 字节')}
async function refresh(){if(loading)return;loading=true;try{const response=await fetch('/api/logics');if(!response.ok)throw Error('查询失败（HTTP '+response.status+'）');const data=await response.json();const row=data.logics.find(item=>item.logic_id===logicID);$('rows').replaceChildren();$('error').textContent='';$('checked').textContent='检查时间：'+new Date(data.checked_at_utc).toLocaleString();$('count').textContent='备份数量：'+(row?.images.length||0);$('empty').textContent=!row?'当前清单中未找到这个 Logic ID。':!row.images.length?'暂无备份镜像文件。':'';if(!row)return;for(const image of [...row.images].sort((a,b)=>Date.parse(b.backup_at_utc)-Date.parse(a.backup_at_utc))){const tr=text($('rows'),'tr','');const date=text(tr,'td',new Date(image.backup_at_utc).toLocaleString());date.title=image.backup_at_utc;const source=text(tr,'td','');text(source,'p',image.source_node);text(source,'code',image.source_sandbox_id);file(text(tr,'td',''),image.archive_key,image.archive_bytes);file(text(tr,'td',''),image.metadata_key,image.metadata_bytes);const deps=text(tr,'td','');const details=text(deps,'details','');details.open=expandedArchives.has(image.archive_key);details.addEventListener('toggle',()=>{if(!details.isConnected)return;if(details.open)expandedArchives.add(image.archive_key);else expandedArchives.delete(image.archive_key)});text(details,'summary',image.dependencies.length+' 个共享依赖层');for(const dep of image.dependencies){file(text(details,'p',''),dep.key,dep.bytes)}}}catch(e){$('error').textContent=e.message}finally{loading=false}}
initAutoRefresh(refresh);
</script></html>
