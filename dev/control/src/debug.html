<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runtime Debug</title>
<style>body{font:14px system-ui;background:#101319;color:#e5e9ef;max-width:1100px;margin:28px auto;padding:0 20px}a{color:#9bc7ff}select,button,textarea{background:#243146;color:white;border:1px solid #53627a;border-radius:5px;padding:10px}textarea{display:block;width:100%;box-sizing:border-box;height:260px;font:14px monospace;margin:14px 0}button{cursor:pointer}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#19202c;padding:16px;border-radius:6px}label{margin-right:18px}.muted{color:#a8b5c9}</style>
{{template "control-header" .}}<h2>Runtime Debug</h2><p class="muted">直接操作所选 Runtime。创建、删除、写文件、执行命令等会修改沙箱；文件系统快照保持源实例运行。休眠保存进程/内存，但此入口不执行额外的 S3 备份。</p>
<label>Runtime <select id="runtime"><option value="runtime1">Runtime 1</option><option value="runtime2">Runtime 2</option></select></label><label>操作 <select id="action"></select></label>
<p>请求参数（JSON）。将示例 Instance ID 替换为实际 ID；创建或查询后可从结果复制。</p><p id="action-help" class="muted"></p><textarea id="payload" aria-label="请求参数"></textarea><button id="run">执行</button><p id="status" role="status"></p><pre id="result">执行结果及调用耗时将在这里显示。</pre>
<script>
const $=id=>document.getElementById(id);let actions=[];
const actionHelp={hibernate:'休眠：保存进程和内存，不额外上传 S3。',wake:'唤醒：恢复休眠实例；timeout 指定唤醒后的运行时限（秒）。',timeout:'设置运行时限：timeout 为从现在起的秒数，到期后执行 Runtime 原有的休眠或删除策略。独立的自动休眠、自动删除计划请在统一视图中设置。'};
function example(){$('action-help').textContent=actionHelp[$('action').value]||'';$('payload').value=JSON.stringify(actions.find(a=>a.id===$('action').value)?.example||{},null,2)}
$('action').onchange=example;
$('run').onclick=async()=>{let payload;try{payload=JSON.parse($('payload').value);if(!payload||Array.isArray(payload)||typeof payload!=='object')throw Error('请输入 JSON 对象')}catch(e){$('status').textContent=e.message;return}payload.runtime=$('runtime').value;$('run').disabled=true;$('status').textContent='执行中…';const start=performance.now();try{const response=await fetch('/api/debug/'+encodeURIComponent($('action').value),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const raw=await response.text();let result;try{result=JSON.parse(raw)}catch{result=raw}$('result').textContent=typeof result==='string'?result:JSON.stringify(result,null,2);$('status').textContent='HTTP '+response.status+' · 浏览器往返 '+(performance.now()-start).toFixed(2)+' ms'+(result.elapsed_ms!==undefined?' · 服务端调用 '+result.elapsed_ms.toFixed(2)+' ms':'')}catch(e){$('status').textContent=e.message}finally{$('run').disabled=false}};
fetch('/api/debug/actions').then(r=>{if(!r.ok)throw Error('加载操作失败');return r.json()}).then(data=>{actions=data;for(const a of actions){const option=document.createElement('option');option.value=a.id;option.textContent=a.label;$('action').append(option)}example()}).catch(e=>$('status').textContent=e.message);
</script></html>
