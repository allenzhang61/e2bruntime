<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logic ID 实例</title>
<style>body{font:14px system-ui;background:#101319;color:#e5e9ef;margin:28px}h1{font-size:23px}a{color:#9bc7ff}button{background:#243146;color:white;border:1px solid #53627a;border-radius:5px;padding:8px;cursor:pointer}nav{display:flex;gap:18px;align-items:center;margin:18px 0}.muted{color:#a8b5c9}.error{color:#ffaaaa}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #354052;vertical-align:top}td p{margin:0 0 5px;line-height:1.4}code{overflow-wrap:anywhere}.table-wrap{overflow:auto}.current{color:#96dfb2}</style>
<main id="view" data-logic-id="{{.LogicID}}"><h1>Logic ID 实例：<code>{{.LogicID}}</code></h1><nav><a href="/">← 统一视图</a><button id="refresh">刷新</button>{{template "refresh-controls" .}}</nav>
<p class="muted">列出各 Runtime 实际观测到的关联实例，以及备份、归属记录中的实例。切换不会删除旧实例。未观测到不等于确认已删除；Runtime 离线时无法确认状态。</p><p id="checked"></p><p id="owner"></p><p id="error" class="error" role="alert"></p><p id="conflicts" class="error"></p>
<div class="table-wrap"><table><thead><tr><th>Runtime</th><th>Instance ID</th><th>运行状态</th><th>关联信息</th><th>备份数量 / 最新时间</th><th>查看</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
const $=id=>document.getElementById(id);const logicID=$('view').dataset.logicId;let loading=false;
function text(parent,tag,value){const el=document.createElement(tag);el.textContent=value;parent.append(el);return el}
async function refresh(){if(loading)return;loading=true;try{const response=await fetch('/api/logics');if(!response.ok)throw Error('查询失败（HTTP '+response.status+'）');const data=await response.json();const row=data.logics.find(item=>item.logic_id===logicID);$('rows').replaceChildren();$('error').textContent='';$('checked').textContent='检查时间：'+new Date(data.checked_at_utc).toLocaleString();if(!row){$('owner').textContent='';$('conflicts').textContent='';$('error').textContent='当前清单中未找到这个 Logic ID。';return}$('owner').textContent=row.owner?'当前归属：'+row.owner.owner_node+' · 实例：'+(row.owner.owner_sandbox_id||'待恢复'):'当前归属：尚未登记';$('conflicts').textContent=(row.conflicts||[]).join('；');
for(const runtime of data.runtimes){const observed=row.instances.filter(i=>i.runtime===runtime.name);const images=row.images.filter(i=>i.source_node===runtime.name);const ids=new Set(observed.map(i=>i.instance_id));for(const image of images)ids.add(image.source_sandbox_id);if(row.owner?.owner_node===runtime.name&&row.owner.owner_sandbox_id)ids.add(row.owner.owner_sandbox_id);if(row.origin_runtime===runtime.name)ids.add(row.origin_instance_id);
if(!ids.size){const tr=text($('rows'),'tr','');text(tr,'td',runtime.name);text(tr,'td','—');text(tr,'td',data.runtime_errors[runtime.name]?'查询失败，状态无法确认':'无关联实例');text(tr,'td','—');text(tr,'td','—');text(tr,'td','—');continue}
for(const id of [...ids].sort()){const instance=observed.find(i=>i.instance_id===id);const backups=images.filter(i=>i.source_sandbox_id===id);const isCurrent=row.owner?row.owner.owner_node===runtime.name&&row.owner.owner_sandbox_id===id:row.current_instances.some(i=>i.runtime===runtime.name&&i.instance_id===id);const tr=text($('rows'),'tr','');text(tr,'td',runtime.name);text(text(tr,'td',''),'code',id);text(tr,'td',instance?({running:'运行中',paused:'休眠'}[instance.state]||instance.state):data.runtime_errors[runtime.name]?'查询失败，状态无法确认':'未观测到实例');const relation=text(tr,'td','');if(isCurrent)text(relation,'p',row.owner?'当前归属实例':'当前实例（尚未登记）').className='current';if(instance)text(relation,'p','Runtime 实际实例');if(backups.length)text(relation,'p','备份来源实例');if(row.origin_runtime===runtime.name&&row.origin_instance_id===id)text(relation,'p','原始实例');const backup=text(tr,'td',backups.length+' 份');if(backups.length){const latest=[...backups].sort((a,b)=>Date.parse(b.backup_at_utc)-Date.parse(a.backup_at_utc))[0];text(backup,'p',new Date(latest.backup_at_utc).toLocaleString())}const links=text(tr,'td','');if(instance){const link=text(links,'a','Web Admin');link.href=runtime.web_url+'/sandboxes/'+encodeURIComponent(id)+'/monitoring';link.target='_blank';link.rel='noopener noreferrer'}else{text(links,'span','—')}}}
}catch(e){$('error').textContent=e.message}finally{loading=false}}
initAutoRefresh(refresh);
</script></html>
