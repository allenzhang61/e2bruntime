{{define "control-header"}}
<style>body{font:14px system-ui;background:#101319;color:#e5e9ef;margin:28px;max-width:none;padding:0}h1{font-size:23px}.muted{color:#a8b5c9}.page-toolbar{margin:20px 0 16px;border-bottom:1px solid #354052}.page-navigation{margin:0;padding-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.view-tabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:#18202d;border:1px solid #354052;border-radius:8px}.view-tabs a{border:1px solid transparent;background:transparent;color:#a8b5c9;padding:9px 12px;font:inherit;white-space:nowrap;text-decoration:none}.view-tabs a[aria-current="page"]{background:#2b3e58;border-color:#536f96;color:#fff}.view-tabs a:hover{background:#243146;color:#fff}.refresh-bar{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap;padding:12px 0}.refresh-bar button,.refresh-bar select{font:inherit;padding:6px 9px}.refresh-bar .refresh-controls{gap:8px}.refresh-bar label{color:#a8b5c9;font-size:13px}.refresh-bar .refresh-hint{min-width:230px}@media(max-width:780px){.page-navigation{align-items:flex-start;flex-direction:column;gap:10px}.refresh-bar{justify-content:flex-start}.view-tabs a{padding:8px}}</style>
<h1>Sandbox Logic Control</h1><p class="muted">Logic ID 在恢复后保持不变；Instance ID 由 Runtime 分配。切换只修改 S3 备份归属；恢复在归属机器上使用最新完整文件系统备份冷启动，不恢复内存或运行中的进程。</p>
<header class="page-toolbar"><nav class="page-navigation" aria-label="页面导航"><div class="view-tabs" aria-label="视图切换">
<a href="/" {{if eq .ActiveTab "overview"}}aria-current="page"{{end}}>统一视图</a>
<a href="/?view=runtime1" {{if eq .ActiveTab "runtime1"}}aria-current="page"{{end}}>Runtime 1 Web Admin</a>
<a href="/?view=runtime2" {{if eq .ActiveTab "runtime2"}}aria-current="page"{{end}}>Runtime 2 Web Admin</a>
<a href="/debug" {{if eq .ActiveTab "debug"}}aria-current="page"{{end}}>Runtime Debug</a>
<a href="/backups" {{if eq .ActiveTab "backups"}}aria-current="page"{{end}}>备份状态</a>
</div></nav>
{{if .Refresh}}<div class="refresh-bar" aria-label="刷新设置"><button id="refresh">刷新</button>{{template "refresh-controls" .}}</div>{{end}}
</header>
{{end}}
