<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sandbox Logic Control</title>
<style>body{font:14px system-ui;background:#101319;color:#e5e9ef;margin:28px}h1{font-size:23px}button,select,input{background:#243146;color:white;border:1px solid #53627a;border-radius:5px;padding:8px;cursor:pointer}button:disabled{opacity:.4;cursor:default}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #354052;padding:12px;text-align:left;vertical-align:top}code{font-size:12px;word-break:break-all}summary{cursor:pointer;color:#9bc7ff}small,.muted{color:#a8b5c9}a{color:#9bc7ff}.error{color:#ffaaaa}iframe{width:100%;height:760px;border:1px solid #53627a;margin-top:12px}.tabs{display:flex;gap:12px;margin:18px 0}#message{white-space:pre-wrap}li{margin:8px 0}dialog{background:#18202d;color:#e5e9ef;border:1px solid #53627a;border-radius:8px;padding:24px;min-width:300px}dialog::backdrop{background:#0009}dialog h2{margin-top:0}dialog label{display:block;margin:16px 0 8px}dialog select,dialog input{width:100%;box-sizing:border-box}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}#switch-error{white-space:pre-wrap}td button+button{margin-left:6px}.time-info p{margin:0 0 4px;line-height:1.4}.time-info p:last-child{margin-bottom:0}.owner-info{font-size:14px;line-height:1.4}.owner-info .owner-line{margin:0 0 4px}.owner-info code{font:inherit;overflow-wrap:anywhere}.instance-group{margin-top:8px}.instance-group:first-child{margin-top:0}.instance-group-label{display:block;color:#a8b5c9;font-size:12px;margin-bottom:4px}.instance-group button{margin:0 4px 4px 0}.instance-link{display:inline-block;background:#243146;color:white;border:1px solid #53627a;border-radius:5px;padding:8px;text-decoration:none;margin-right:6px}</style>
{{template "control-header" .}}
<div id="message"></div><main id="overview" data-view="{{.View}}"><p id="health"></p><table><thead><tr><th>Logic ID</th><th>当前实例 ID</th><th>当前所在机器</th><th>当前运行状态</th><th>当前时间信息</th><th>备份归属</th><th>Logic ID 操作</th><th>实例操作</th></tr></thead><tbody id="rows"></tbody></table><h2>恢复操作记录</h2><div id="jobs"></div></main><section id="single" hidden><p>下面展示对应 Runtime 的 Web Admin，也可 <a id="open" target="_blank">在新窗口打开</a>。</p><iframe id="frame" title="Runtime Web Admin"></iframe></section>
<dialog id="switch-dialog" aria-labelledby="switch-title"><h2 id="switch-title">切换 Runtime</h2><p id="switch-logic"></p><label for="switch-runtime">目标 Runtime</label><select id="switch-runtime"></select><p id="switch-error" class="error" role="alert"></p><div class="dialog-actions"><button id="switch-cancel" type="button">取消</button><button id="switch-confirm" type="button">确定</button></div></dialog>
<dialog id="plan-dialog" aria-labelledby="plan-title"><h2 id="plan-title"></h2><p id="plan-instance"></p><label for="plan-at">执行时间（本机时区）</label><input id="plan-at" type="datetime-local" required><p class="muted">由 Control 调度，运行期间持续续期；仍受 Runtime 最长存活限制。取消此计划不会影响另一项计划。</p><p id="plan-error" class="error" role="alert"></p><div class="dialog-actions"><button id="plan-cancel" type="button">取消</button><button id="plan-confirm" type="button">确定</button></div></dialog>
<script>
let runtimes=[],viewInitialized=false,loading=false,operating=false,switchLogic=null,switchPending=false;
const deleting=new Set(),instanceBusy=new Set();
let planInstance=null,planAction=null,planPending=false;
const $=id=>document.getElementById(id);const text=(parent,tag,value)=>{const e=document.createElement(tag);e.textContent=value;parent.append(e);return e};
async function request(path,body){const response=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});if(!response.ok){const raw=await response.text();let message=raw;try{message=JSON.parse(raw).error||raw}catch{}throw Error(message)}return response.json()}
function view(name){$('overview').hidden=!!name;$('single').hidden=!name;if(name){const rt=runtimes.find(r=>r.name===name);if(!rt)return;$('frame').src=rt.web_url+'/sandboxes';$('open').href=rt.web_url+'/sandboxes'}}
async function refresh(){if(loading)return;loading=true;try{const [data,jobs]=await Promise.all([request('/api/logics'),request('/api/jobs')]);runtimes=data.runtimes;if(!viewInitialized){view($('overview').dataset.view||'');viewInitialized=true}operating=jobs.some(j=>!['succeeded','failed'].includes(j.status));$('health').textContent='检查时间 '+data.checked_at_utc+' · '+(Object.entries(data.runtime_errors).map(([n,e])=>n+': '+e).join('；')||'两个 Runtime 均可访问');$('rows').replaceChildren();for(const row of data.logics){const currentInstances=row.current_instances||[];const tr=document.createElement('tr');$('rows').append(tr);text(text(tr,'td',''),'code',row.logic_id);const instances=text(tr,'td',''),machines=text(tr,'td',''),states=text(tr,'td',''),deadlines=text(tr,'td','');deadlines.className='time-info';for(const i of currentInstances){text(instances,'p',i.instance_id).style.fontFamily='monospace';text(machines,'p',i.runtime);text(states,'p',i.state);for(const [policy,label] of [['pause','自动休眠'],['kill','自动删除']]){const deadline=text(deadlines,'p','');if(i.plan){const at=policy==='pause'?i.plan.sleep_at:i.plan.delete_at;if(at){deadline.dataset.deadline=at;deadline.dataset.policy=policy;deadline.title=label+'时间：'+new Date(at).toLocaleString()}else{deadline.textContent=policy==='pause'&&i.state==='paused'?'休眠：已休眠':'不会'+label}if(i.plan.error)deadline.title=i.plan.error}else if(i.state==='paused'){deadline.textContent=policy==='pause'?'休眠：已休眠':'自动删除：无运行中的删除计划'}else if(i.state==='running'&&['pause','kill'].includes(i.on_timeout)){if(i.on_timeout===policy){if(i.end_at){deadline.dataset.deadline=i.end_at;deadline.dataset.policy=policy;deadline.title=label+'时间：'+new Date(i.end_at).toLocaleString()}else{deadline.textContent=label+'：时间无法确认'}}else{deadline.textContent='不会'+label}}else{deadline.textContent=label+'：无法确认'}}const backup=text(deadlines,'p','');if(i.backup_state==='scheduled'&&i.next_backup_at){backup.dataset.backupDeadline=i.next_backup_at;backup.title='下次备份调度：'+new Date(i.next_backup_at).toLocaleString()}else{backup.textContent='下次备份：'+({paused:'不备份（休眠期间暂停）',not_owner:'不备份（无备份权限）',stopped:'不备份（服务已停止）',backing_up:'正在备份',queued:'本轮待备份'}[i.backup_state]||'无法确认')}}if(!currentInstances.length){text(instances,'span',row.owner?.owner_sandbox_id||'—');text(machines,'span',row.owner?.owner_node||'—');text(states,'span',({awaiting_restore:'待恢复',missing:'实例未找到',unknown:'状态无法确认',unassigned:'暂无当前实例'}[row.current_instance_state]||'暂无当前实例'));text(deadlines,'span','暂无当前实例时间信息')}for(const conflict of row.conflicts||[])text(instances,'p',conflict).className='error';const current=text(tr,'td','');current.className='owner-info';if(row.owner){for(const [label,value] of [['机器',row.owner.owner_node],['实例',row.owner.owner_sandbox_id||'—']]){const line=text(current,'div','');line.className='owner-line';text(line,'span',label+'：');text(line,'code',value)}}else{text(current,'div','尚未登记（首次备份时建立）')}
const action=text(tr,'td','');const backups=text(action,'a','备份镜像文件（'+row.images.length+'）');backups.className='instance-link';backups.href='/logics/'+encodeURIComponent(row.logic_id)+'/backups';backups.target='_blank';backups.rel='noopener noreferrer';const inspect=text(action,'a','查看实例');inspect.className='instance-link';inspect.href='/logics/'+encodeURIComponent(row.logic_id)+'/instances';inspect.target='_blank';inspect.rel='noopener noreferrer';const switchButton=text(action,'button','切换');switchButton.disabled=operating||deleting.size>0||instanceBusy.size>0;switchButton.onclick=()=>openSwitch(row);
const restoreButton=text(action,'button','恢复');restoreButton.disabled=operating||deleting.size>0||instanceBusy.size>0||!row.images.length||!row.owner;restoreButton.title=row.owner?'在 '+row.owner.owner_node+' 上恢复最新备份':'请先切换并设置归属';restoreButton.onclick=async()=>{restoreButton.disabled=true;$('message').textContent='正在提交恢复操作…';try{const job=await request('/api/restore',{logic_id:row.logic_id});$('message').textContent='恢复操作已提交：'+job.id+' → '+job.target_runtime;await refresh()}catch(e){$('message').textContent=e.message;restoreButton.disabled=false}};
const instanceActions=text(tr,'td','');
if(!currentInstances.length){const deleteButton=text(instanceActions,'button','删除');deleteButton.disabled=true;deleteButton.title='没有可删除的实际实例';for(const label of ['休眠','唤醒','设置自动休眠','取消自动休眠','设置自动删除','取消自动删除','WebShell'])text(instanceActions,'button',label).disabled=true}
for(const instance of currentInstances){const key=instance.runtime+'/'+instance.instance_id;const section=text(instanceActions,'div','');if(currentInstances.length>1)text(section,'p',key);const runtime=runtimes.find(rt=>rt.name===instance.runtime);if(runtime&&instance.state==='running'){const shell=text(section,'a','WebShell');shell.className='instance-link';shell.href=runtime.web_url+'/sandboxes/'+encodeURIComponent(instance.instance_id)+'/terminal';shell.target='_blank';shell.rel='noopener noreferrer';shell.title='打开 '+key+' 的终端'}else{const shell=text(section,'button','WebShell');shell.disabled=true;shell.title='请先唤醒实例'}const sleepGroup=text(section,'div','');sleepGroup.className='instance-group';text(sleepGroup,'span','休眠').className='instance-group-label';for(const [action,label,state] of [['hibernate','休眠','running'],['wake','唤醒','paused']]){const stateButton=text(sleepGroup,'button',label);stateButton.disabled=operating||deleting.has(key)||instanceBusy.has(key)||instance.state!==state;stateButton.title=label+' '+key+(action==='hibernate'?'（保存进程和内存，不额外上传 S3）':'（唤醒后运行 30 分钟）');stateButton.onclick=()=>changeInstanceState(instance,action,label,section)}addPlanButtons(sleepGroup,instance,'sleep',section);const deleteGroup=text(section,'div','');deleteGroup.className='instance-group';text(deleteGroup,'span','删除').className='instance-group-label';const deleteButton=text(deleteGroup,'button',deleting.has(key)?'删除中…':'删除');deleteButton.disabled=operating||deleting.has(key)||instanceBusy.has(key);addPlanButtons(deleteGroup,instance,'delete',section);deleteButton.title='删除 '+key+'，保留 S3 备份';deleteButton.onclick=async()=>{if(deleting.has(key))return;deleting.add(key);deleteButton.disabled=true;deleteButton.textContent='删除中…';$('message').textContent='正在删除 '+key+'…';try{await request('/api/debug/delete',{runtime:instance.runtime,sandbox_id:instance.instance_id});$('message').textContent='已删除 '+key+'；S3 备份保留。'}catch(e){$('message').textContent='删除失败：'+e.message}finally{deleting.delete(key);await refresh()}}}
}updateCountdowns();updateBackupCountdowns();$('jobs').replaceChildren();for(const j of jobs){const p=text($('jobs'),'p',j.logic_id+' → '+j.target_runtime+' · '+j.status+' · '+j.created_at_utc+(j.instance_id?' · '+j.instance_id:''));if(j.error)text(p,'span',' · '+j.error).className='error'}
}catch(e){$('message').textContent=e.message}finally{loading=false}}
function openSwitch(row){switchLogic=row.logic_id;$('switch-logic').textContent=row.logic_id;$('switch-error').textContent='';$('switch-runtime').replaceChildren();for(const rt of runtimes){const option=text($('switch-runtime'),'option',rt.name);option.value=rt.name}$('switch-runtime').value=row.owner?.owner_node||runtimes[0]?.name||'';$('switch-confirm').disabled=!runtimes.length;$('switch-dialog').showModal()}
$('switch-cancel').onclick=()=>{if(!switchPending)$('switch-dialog').close()};
$('switch-dialog').addEventListener('cancel',event=>{if(switchPending)event.preventDefault()});
$('switch-confirm').onclick=async()=>{if(switchPending||!switchLogic)return;switchPending=true;$('switch-confirm').disabled=true;$('switch-confirm').textContent='切换中…';$('switch-cancel').disabled=true;$('switch-runtime').disabled=true;$('switch-error').textContent='';try{const result=await request('/api/switch',{logic_id:switchLogic,target_runtime:$('switch-runtime').value});$('message').textContent='归属已设置为 '+result.owner.owner_node+'；尚未执行恢复。';$('switch-dialog').close();await refresh()}catch(e){$('switch-error').textContent=e.message}finally{switchPending=false;$('switch-confirm').disabled=false;$('switch-confirm').textContent='确定';$('switch-cancel').disabled=false;$('switch-runtime').disabled=false}};
async function changeInstanceState(instance,action,label,section){const key=instance.runtime+'/'+instance.instance_id;if(instanceBusy.has(key)||deleting.has(key))return;instanceBusy.add(key);for(const button of section.querySelectorAll('button'))button.disabled=true;$('message').textContent='正在'+label+' '+key+'…';try{const payload={runtime:instance.runtime,sandbox_id:instance.instance_id};if(action==='wake')payload.timeout=1800;await request('/api/debug/'+action,payload);$('message').textContent=key+' '+label+'成功'+(action==='wake'?'；到期时间设为从现在起 30 分钟。':'；已保存进程和内存，未额外上传 S3 备份。')}catch(e){$('message').textContent=label+'失败：'+e.message}finally{instanceBusy.delete(key);await refresh()}}
function addPlanButtons(group,instance,kind,section){const key=instance.runtime+'/'+instance.instance_id,label=kind==='sleep'?'休眠':'删除';for(const [prefix,action] of [['设置','set_'],['取消','cancel_']]){const button=text(group,'button',prefix+'自动'+label);button.disabled=operating||deleting.has(key)||instanceBusy.has(key)||(kind==='sleep'&&prefix==='设置'&&instance.state!=='running');button.onclick=()=>prefix==='设置'?openPlan(instance,action+kind):submitPlan(instance,action+kind,null,section).catch(e=>{$('message').textContent=e.message})}}
function openPlan(instance,action){planInstance=instance;planAction=action;$('plan-title').textContent=action==='set_sleep'?'设置自动休眠':'设置自动删除';$('plan-instance').textContent=instance.runtime+' / '+instance.instance_id;$('plan-error').textContent='';const date=new Date(Date.now()+30*60000);date.setSeconds(0,0);$('plan-at').value=new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16);$('plan-dialog').showModal()}
async function submitPlan(instance,action,at,section){const key=instance.runtime+'/'+instance.instance_id;if(instanceBusy.has(key))return;instanceBusy.add(key);if(section)for(const button of section.querySelectorAll('button'))button.disabled=true;try{const body={runtime:instance.runtime,sandbox_id:instance.instance_id,action};if(at)body.at=at;await request('/api/instances/schedule',body);$('message').textContent=(action.startsWith('set_')?'已设置':'已取消')+'自动'+(action.endsWith('sleep')?'休眠':'删除')+(at?'：'+new Date(at).toLocaleString():'')+'；另一项计划保持不变。';await refresh()}finally{instanceBusy.delete(key);await refresh()}}
$('plan-cancel').onclick=()=>{if(!planPending)$('plan-dialog').close()};
$('plan-dialog').addEventListener('cancel',event=>{if(planPending)event.preventDefault()});
$('plan-confirm').onclick=async()=>{if(planPending||!planInstance)return;const date=new Date($('plan-at').value);if(!Number.isFinite(date.getTime())||date.getTime()<=Date.now()+10000){$('plan-error').textContent='请选择至少 10 秒之后的执行时间';return}planPending=true;$('plan-confirm').disabled=true;$('plan-cancel').disabled=true;$('plan-at').disabled=true;try{await submitPlan(planInstance,planAction,date.toISOString());$('plan-dialog').close()}catch(e){$('plan-error').textContent=e.message}finally{planPending=false;$('plan-confirm').disabled=false;$('plan-cancel').disabled=false;$('plan-at').disabled=false}};
function updateCountdowns(){for(const element of document.querySelectorAll('[data-deadline]')){const remaining=Math.ceil((Date.parse(element.dataset.deadline)-Date.now())/1000);const action=element.dataset.policy==='pause'?'休眠':'删除';const label='自动'+action+'：';if(!Number.isFinite(remaining)){element.textContent=label+'无法确认';continue}if(remaining<=0){element.textContent=label+'已到期，等待'+action;continue}const hours=Math.floor(remaining/3600),minutes=Math.floor(remaining%3600/60),seconds=remaining%60;element.textContent=label+(hours?hours+' 小时 ':'')+(minutes?minutes+' 分 ':'')+seconds+' 秒后'+action}}
function updateBackupCountdowns(){for(const element of document.querySelectorAll('[data-backup-deadline]')){const seconds=Math.ceil((Date.parse(element.dataset.backupDeadline)-Date.now())/1000);element.textContent=!Number.isFinite(seconds)?'下次备份：无法确认':seconds<=0?'下次备份：等待调度':'下次备份：'+Math.floor(seconds/60)+' 分 '+seconds%60+' 秒后'}}
setInterval(()=>{updateCountdowns();updateBackupCountdowns()},1000);
{{if .Refresh}}initAutoRefresh(refresh);{{else}}refresh();{{end}}
</script></html>
