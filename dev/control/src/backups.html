<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>备份状态</title>
<style>body{font:14px system-ui;background:#101319;color:#e5e9ef;margin:28px}h1{font-size:23px}a{color:#9bc7ff}button{background:#243146;color:white;border:1px solid #53627a;border-radius:5px;padding:8px;cursor:pointer}nav{display:flex;gap:18px;align-items:center;margin:18px 0}.muted{color:#a8b5c9}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #354052;vertical-align:top}td p{margin:0 0 5px;line-height:1.4}code{overflow-wrap:anywhere}.status{font-weight:600}.running{color:#96dfb2}.stopped{color:#ffc98a}.error{color:#ffaaaa}</style>
{{template "control-header" .}}<h2>备份状态</h2>
<p class="muted">备份进程在各 Runtime 上独立运行；只备份运行中且有备份权限的实例。服务运行不代表每次备份都成功。</p><p id="checked"></p><p id="error" class="error" role="alert"></p>
<div class="table-wrap"><table><thead><tr><th>Runtime</th><th>任务状态</th><th>备份配置</th><th>备份目录</th><th>当前进度</th><th>下次备份</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
const $=id=>document.getElementById(id);let loading=false;
function text(parent,tag,value){const el=document.createElement(tag);el.textContent=value;parent.append(el);return el}
function countdown(){for(const el of document.querySelectorAll('[data-deadline]')){const seconds=Math.ceil((Date.parse(el.dataset.deadline)-Date.now())/1000);el.textContent=seconds<=0?'已到调度时间':Math.floor(seconds/60)+' 分 '+seconds%60+' 秒后'}}
async function refresh(){if(loading)return;loading=true;try{const response=await fetch('/api/backups');if(!response.ok)throw Error('查询失败（HTTP '+response.status+'）');const data=await response.json();$('error').textContent='';$('checked').textContent='检查时间：'+new Date(data.checked_at_utc).toLocaleString();$('rows').replaceChildren();for(const view of data.runtimes){const tr=text($('rows'),'tr','');text(tr,'td',view.runtime);const state=text(tr,'td','');const labels={waiting:'运行中 · 等待下一轮',cycling:'运行中 · 正在执行',stopped:'已停止',unknown:'状态无法确认',unreachable:'查询服务不可访问'};const badge=text(state,'p',labels[view.status]||'状态无法确认');badge.className='status '+(['cycling','waiting'].includes(view.status)?'running':view.status==='stopped'?'stopped':'error');if(view.error)text(state,'p',view.error);const config=text(tr,'td',''),path=text(tr,'td','');if(view.config){text(config,'p','间隔：'+view.config.interval_seconds+' 秒');text(config,'p','保留：最近 '+view.config.keep+' 组 / 实例');text(config,'p','类型：文件系统快照');text(config,'p','Bucket：'+view.config.bucket);text(path,'code',view.config.archive_path)}else{text(config,'p','配置无法获取');text(path,'span','—')}const progress=text(tr,'td','');if(view.current_instance_id){text(progress,'p','正在备份：');text(progress,'code',view.current_instance_id)}else{text(progress,'p',view.status==='waiting'?'等待下一轮':view.status==='cycling'?'本轮执行中':'—')}if(view.status==='cycling')text(progress,'p','本轮已处理：'+(view.processed_instances||[]).length+' 个');const next=text(tr,'td','');if(['waiting','cycling'].includes(view.status)&&view.next_cycle_at&&!view.next_cycle_at.startsWith('0001')){const timer=text(next,'p','');timer.dataset.deadline=view.next_cycle_at;text(next,'p',new Date(view.next_cycle_at).toLocaleString())}else{text(next,'p',view.status==='stopped'?'不备份（服务已停止）':'无法确认')}}countdown()}catch(e){$('error').textContent=e.message}finally{loading=false}}
initAutoRefresh(refresh);setInterval(countdown,1000);
</script></html>
