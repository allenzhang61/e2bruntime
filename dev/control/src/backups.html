<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>备份状态</title>
<style>body{font:14px system-ui;background:#101319;color:#e5e9ef;margin:28px}h1{font-size:23px}a{color:#9bc7ff}button{background:#243146;color:white;border:1px solid #53627a;border-radius:5px;padding:8px;cursor:pointer}nav{display:flex;gap:18px;align-items:center;margin:18px 0}.muted{color:#a8b5c9}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #354052;vertical-align:top}td p{margin:0 0 5px;line-height:1.4}code{overflow-wrap:anywhere}.status{font-weight:600}.running{color:#96dfb2}.stopped{color:#ffc98a}.error{color:#ffaaaa}dialog{background:#18202d;color:#e5e9ef;border:1px solid #53627a;border-radius:8px;padding:24px;max-width:440px}dialog::backdrop{background:#0009}dialog label{display:block;margin:14px 0 6px}dialog input{width:100%;box-sizing:border-box;background:#243146;color:white;border:1px solid #53627a;border-radius:5px;padding:8px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}</style>
{{template "control-header" .}}<h2>备份状态</h2>
<p class="muted">备份进程在各 Runtime 上独立运行；只备份运行中且有备份权限的实例。服务运行不代表每次备份都成功。</p><p id="config-message" role="status"></p><p id="checked"></p><p id="error" class="error" role="alert"></p>
<div class="table-wrap"><table><thead><tr><th>Runtime</th><th>任务状态</th><th>备份配置</th><th>备份目录</th><th>当前进度</th><th>下次备份</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<dialog id="config-dialog" aria-labelledby="config-title"><h2 id="config-title">修改备份配置</h2><p id="config-runtime"></p><label for="config-enabled">定时备份</label><select id="config-enabled"><option value="true">开启</option><option value="false">关闭</option></select><label for="config-interval">备份间隔（秒）</label><input id="config-interval" type="number" min="10" max="86400" step="1" required><label for="config-keep">保留数量（每个实例）</label><input id="config-keep" type="number" min="1" max="1000" step="1" required><p class="muted">配置持久保存，正在执行的备份完成后采用新配置。减少保留数量会在后续备份成功时清理更早的备份；关闭后不再调度新备份，当前备份会完成；开启后运行中的备份服务立即执行一轮。</p><p id="config-error" class="error" role="alert"></p><div class="dialog-actions"><button id="config-cancel" type="button">取消</button><button id="config-save" type="button">保存</button></div></dialog>
<script>
const $=id=>document.getElementById(id);let loading=false,configRuntime=null,saving=false;
function text(parent,tag,value){const el=document.createElement(tag);el.textContent=value;parent.append(el);return el}
function countdown(){for(const el of document.querySelectorAll('[data-deadline]')){const seconds=Math.ceil((Date.parse(el.dataset.deadline)-Date.now())/1000);el.textContent=seconds<=0?'已到调度时间':Math.floor(seconds/60)+' 分 '+seconds%60+' 秒后'}}
async function refresh(){if(loading)return;loading=true;try{const response=await fetch('/api/backups');if(!response.ok)throw Error('查询失败（HTTP '+response.status+'）');const data=await response.json();$('error').textContent='';$('checked').textContent='检查时间：'+new Date(data.checked_at_utc).toLocaleString();$('rows').replaceChildren();for(const view of data.runtimes){const tr=text($('rows'),'tr','');text(tr,'td',view.runtime);const state=text(tr,'td','');const labels={waiting:'运行中 · 等待下一轮',cycling:'运行中 · 正在执行',disabled:'已关闭',stopped:'已停止',unknown:'状态无法确认',unreachable:'查询服务不可访问'};const badge=text(state,'p',labels[view.status]||'状态无法确认');badge.className='status '+(['cycling','waiting'].includes(view.status)?'running':['stopped','disabled'].includes(view.status)?'stopped':'error');if(view.error)text(state,'p',view.error);const config=text(tr,'td',''),path=text(tr,'td','');if(view.config){text(config,'p','定时备份：'+(view.config.enabled?'开启':'关闭'));text(config,'p','间隔：'+view.config.interval_seconds+' 秒');text(config,'p','保留：最近 '+view.config.keep+' 组 / 实例');text(config,'p','类型：文件系统快照');text(config,'p','Bucket：'+view.config.bucket);text(path,'code',view.config.archive_path)}else{text(config,'p','配置无法获取');text(path,'span','—')}const progress=text(tr,'td','');if(view.current_instance_id){text(progress,'p','正在备份：');text(progress,'code',view.current_instance_id)}else{text(progress,'p',view.status==='waiting'?'等待下一轮':view.status==='cycling'?'本轮执行中':'—')}if(view.status==='cycling')text(progress,'p','本轮已处理：'+(view.processed_instances||[]).length+' 个');const next=text(tr,'td','');if(['waiting','cycling'].includes(view.status)&&view.next_cycle_at&&!view.next_cycle_at.startsWith('0001')){const timer=text(next,'p','');timer.dataset.deadline=view.next_cycle_at;text(next,'p',new Date(view.next_cycle_at).toLocaleString())}else{text(next,'p',view.status==='disabled'?'不备份（配置已关闭）':view.status==='stopped'?'不备份（服务已停止）':'无法确认')}const operations=text(tr,'td','');const edit=text(operations,'button','修改配置');edit.disabled=!view.config||saving;edit.onclick=()=>openBackupConfig(view)}countdown()}catch(e){$('error').textContent=e.message}finally{loading=false}}
function openBackupConfig(view){configRuntime=view.runtime;$('config-runtime').textContent=view.runtime;$('config-enabled').value=String(view.config.enabled);$('config-interval').value=view.config.interval_seconds;$('config-keep').value=view.config.keep;$('config-error').textContent='';$('config-dialog').showModal()}
$('config-cancel').onclick=()=>{if(!saving)$('config-dialog').close()};
$('config-dialog').addEventListener('cancel',event=>{if(saving)event.preventDefault()});
$('config-save').onclick=async()=>{if(saving||!configRuntime)return;const interval=Number($('config-interval').value),keep=Number($('config-keep').value);if(!Number.isInteger(interval)||interval<10||interval>86400||!Number.isInteger(keep)||keep<1||keep>1000){$('config-error').textContent='间隔须为 10–86400 秒，保留数量须为 1–1000';return}saving=true;for(const id of ['config-save','config-cancel','config-interval','config-keep','config-enabled'])$(id).disabled=true;$('config-error').textContent='';try{const response=await fetch('/api/backups/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({runtime:configRuntime,interval_seconds:interval,keep,enabled:$('config-enabled').value==='true'})});const data=await response.json();if(!response.ok)throw Error(data.error||'保存失败');$('config-dialog').close();$('config-message').textContent=configRuntime+' 配置已保存（'+($('config-enabled').value==='true'?'开启':'关闭')+'）：每 '+interval+' 秒备份，保留最近 '+keep+' 组 / 实例。'}catch(e){$('config-error').textContent=e.message}finally{saving=false;for(const id of ['config-save','config-cancel','config-interval','config-keep','config-enabled'])$(id).disabled=false;await refresh()}};
initAutoRefresh(refresh);setInterval(countdown,1000);
</script></html>
